<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Аналитика - MatchIQPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h4 class="text-success mb-4">⚽ MatchIQPro</h4>
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html">Дашборд</a>
                <a class="nav-link" href="matches.html">Матчи</a>
                <a class="nav-link" href="standings.html">Турниры</a>
                <a class="nav-link" href="players.html">Игроки</a>
                <a class="nav-link active" href="analytics.html">AI Аналитика</a>
            </nav>
        </aside>

        <main class="main-content">
            <h2 class="mb-4">AI Прогнозы</h2>
            
            <section class="stat-card mb-4 border-primary">
                <h5 class="text-primary">✨ MatchIQ Predictive Engine</h5>
                <p class="text-muted">Оценка вероятности исходов на основе машинного обучения.</p>
            </section>

            <!-- HTML Форма для соответствия требованиям мидтерма -->
            <section class="stat-card">
                <h5 class="mb-3">Запросить кастомный прогноз</h5>
                <form action="#" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="teamA" class="form-label">Команда А</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="teamA" required>
                        </div>
                        <div class="col-md-6">
                            <label for="teamB" class="form-label">Команда Б</label>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="teamB" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="algorithm" class="form-label">Алгоритм расчета</label>
                        <select class="form-select bg-dark text-light border-secondary" id="algorithm">
                            <option value="xg">xG Модель (Ожидаемые голы)</option>
                            <option value="possession">Модель контроля мяча</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Сгенерировать прогноз</button>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
