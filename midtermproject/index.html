<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchIQPro - Дашборд</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <!-- Боковая панель (Navigation) -->
        <aside class="sidebar">
            <h4 class="text-success mb-4">⚽ MatchIQPro</h4>
            <p class="text-muted small">МЕНЮ</p>
            <nav class="nav flex-column">
                <a class="nav-link active" href="index.html">Дашборд</a>
                <a class="nav-link" href="matches.html">Матчи</a>
                <a class="nav-link" href="standings.html">Турниры</a>
                <a class="nav-link" href="players.html">Игроки</a>
            </nav>
            <p class="text-muted small mt-4">ADVANCED</p>
            <nav class="nav flex-column">
                <a class="nav-link" href="analytics.html">AI Аналитика</a>
            </nav>
        </aside>

        <!-- Главная область -->
        <main class="main-content">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <h2>Обзор статистики</h2>
                <input type="text" class="form-control w-25 bg-dark text-light border-secondary" placeholder="Найти команду или игрока...">
            </header>

            <!-- Сетка Bootstrap (Grid system) -->
            <section class="row g-4 mb-4">
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <span class="text-muted">Обработано матчей</span>
                        <h3>24,592</h3>
                        <small class="text-success">↑ +120 за неделю</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <span class="text-muted">Live Матчи <span class="text-danger">●</span></span>
                        <h3>8</h3>
                        <small class="text-muted">АПЛ, Ла Лига, Серия А</small>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="stat-card h-100">
                        <span class="text-muted">Средний xG за матч</span>
                        <h3>2.74</h3>
                        <small class="text-muted">На основе топ-5 лиг Европы</small>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
