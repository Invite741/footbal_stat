<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матч-центр - MatchIQPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <h4 class="text-success mb-4">⚽ MatchIQPro</h4>
            <nav class="nav flex-column">
                <a class="nav-link" href="index.html">Дашборд</a>
                <a class="nav-link active" href="matches.html">Матчи</a>
                <a class="nav-link" href="standings.html">Турниры</a>
                <a class="nav-link" href="players.html">Игроки</a>
                <a class="nav-link" href="analytics.html">AI Аналитика</a>
            </nav>
        </aside>

        <main class="main-content">
            <h2 class="mb-4">Матч-центр</h2>
            <div class="btn-group mb-4">
                <button class="btn btn-outline-success active">Все матчи</button>
                <button class="btn btn-outline-secondary">Live</button>
                <button class="btn btn-outline-secondary">Завершенные</button>
            </div>

            <section class="row g-4">
                <article class="col-md-6">
                    <div class="stat-card">
                        <h6 class="text-muted border-bottom border-secondary pb-2">АНГЛИЙСКАЯ ПРЕМЬЕР-ЛИГА <span class="badge bg-danger float-end">72' MIN</span></h6>
                        <div class="d-flex justify-content-between align-items-center mt-3">
                            <div class="text-center">
                                <h5>Арсенал</h5>
                            </div>
                            <div class="text-center">
                                <h3 class="text-success">2 - 1</h3>
                                <small class="text-muted">xG: 1.8 - 0.7</small>
                            </div>
                            <div class="text-center">
                                <h5>Челси</h5>
                            </div>
                        </div>
                    </div>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
